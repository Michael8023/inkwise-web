<html lang="zh-CN">
  <head>

    <title>识谛个人中心</title>
    <link rel="stylesheet" href="popup.css" />

  <body>
    <main class="popup">
      <header><img src="brand/shidea-mark.png" alt="" /><div><strong>识谛</strong><span>SHIDEA CONTROL</span></div></header>

    </main>
    <script src="popup.js"></script>
  </body>
